<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exhibition — MoMA</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- Site Navigation -->
  <nav class="site-nav">
    <div class="site-nav__inner page-container">
      <a class="site-nav__logo" href="#">MoMA</a>
      <ul class="site-nav__links">
        <li><a class="site-nav__link" href="#">Exhibitions</a></li>
        <li><a class="site-nav__link" href="#">Collection</a></li>
        <li><a class="site-nav__link" href="#">Learn</a></li>
        <li><a class="site-nav__link" href="#">Visit</a></li>
      </ul>
    </div>
  </nav>

  <!-- Exhibition Detail -->
  <main class="exhibition">

    <!-- Hero -->
    <section class="exhibition__hero">
    </section>

    <!-- Intro: title, dates, and key info -->
    <section class="exhibition__intro page-container">
    </section>

    <!-- Body: essay, description, press text -->
    <section class="exhibition__body page-container">
    </section>

    <!-- Sidebar: practical info, tickets, hours -->
    <aside class="exhibition__sidebar page-container">
    </aside>

    <!-- Related: artworks, artists, or exhibitions -->
    <section class="exhibition__related">
    </section>

  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="site-footer__inner page-container">
    </div>
  </footer>

</body>
</html>
